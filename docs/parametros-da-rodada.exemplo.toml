# MODELO — mostra a FORMA do arquivo de parâmetros de uma rodada. É recusado como
# entrada: copie para fora do repositório e mude o que quiser mudar.
#
# Desde 04/09/2026 (D-034) TODA chave tem um valor ADOTADO em `src/config/adotados.py`,
# com decisão registrada. Este arquivo é OPCIONAL: sem ele, a rodada usa só os adotados.
# O que você declarar aqui vale para ESTA rodada, é rotulado PROVISÓRIO na planilha e
# no Registro quando difere do adotado, e NÃO muda o adotado — adotar é decisão em
# `docs/decisoes.md` mais CHANGELOG.
#
# Chave desconhecida é erro; nome digitado errado nunca é descartado em silêncio.
# Toda unidade é concreta: dias, pontos de 100, por cento, corretores, leads.
#
# Como usar:
#   uv run python -m executar.sexta --externo /caminho/da/saida/do/raspador \
#       [--parametros ~/parametros-2026-09-05.toml]

# --- QUEM ENTRA: o banco decide ------------------------------------------------
[conversao]
# Olhamos para trás quantos dias para descobrir o que vende. Adotado: 180.
janela_dias = 180

[corretor]
# Gestor sem login há mais dias que isto trava o relaxamento dos imóveis dele (D-029).
login_janela_dias = 30
# Quantos corretores ativos o distrito precisa ter (D-015).
minimo_no_distrito = 2

# --- EM QUE ORDEM: o portal classifica -----------------------------------------
[portal]
# Pontos de 100; os três somam 100. Visualizações mediram zero em 300/300 anúncios.
peso_nota = 70
peso_cliques = 30
peso_visualizacoes = 0
# A raspagem precisa cobrir esta fração dos candidatos (%) para a ordem vir do portal.
cobertura_minima = 50
# Dado do portal mais velho que isto (dias) não entra.
idade_maxima_dias = 2
# Imóvel elegível que a raspagem não trouxe: "fim_da_fila" ou "mediana".
sem_anuncio = "fim_da_fila"
# Se a raspagem não entrar: "leads_180d", "produtividade_gestor" ou "cadastro_mais_novo".
ordem_quando_nao_entra = "leads_180d"

# --- EM QUE ORDEM: os descontos, em pontos de 100 ------------------------------
[desconto]
janela_sem_resultado = 20
sem_avaliacao = 5
sem_lead_180d = 10
# Quanto o desconto da janela anterior encolhe a cada carga (% por carga).
perdao_por_semana = 50

# --- QUANTOS: a régua de resultado por nível (nº 14) ---------------------------
# NULA por decisão do dono (04/09/2026): 88% das janelas históricas geraram zero lead.
# Declare os DOIS níveis (super > destaque) para ligá-la nesta rodada; omita para
# deixá-la nula — a planilha declara "régua nula" em toda linha.
#
# [resultado_esperado]
# super_destaque = 3
# destaque = 1
