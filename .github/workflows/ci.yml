name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    # Postgres de verdade no CI. Sem ele os testes de I/O do Registro PULAM, e a
    # fatia do produtor de janelas mostrou o custo disso: o defeito de idempotência
    # que os três portões apanharam vivia justamente na metade que nenhum ambiente
    # automatizado exercitava. Uma garantia central que não roda em lugar nenhum é
    # uma garantia declarada.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: orquestrador_portais
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      POSTGRES_URL: postgresql://ci:ci@127.0.0.1:5432/orquestrador_portais
    steps:
      - uses: actions/checkout@v4
      # O passo da travessia roda `npm ci`, e sem isto o Node seria o que o runner
      # trouxer naquele mês — validando a serialização numa versão que não é a que
      # constrói o console (o job `console` fixa a mesma).
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - uses: astral-sh/setup-uv@v5
      - name: Dependências de desenvolvimento
        run: uv sync --group dev
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Formatação
        run: uv run ruff format --check src tests scripts
      # Tipos do domínio PURO em modo estrito: é o que sustenta a fronteira de PII
      # do invariante 3 (só `PayloadModelo` chega a modelo). Sem este passo, a
      # fronteira seria honorária — ver comentário em pyproject.toml.
      # `src/config` e `src/executar` entraram junto com o ponto de entrada da sexta:
      # os dois já passavam limpos, e deixar de fora o módulo que decide se a rodada
      # roda seria escolher não olhar justamente onde o erro é caro.
      - name: Tipos (domínio, config e pontos de entrada — estrito)
        run: uv run mypy --strict src/dominio src/config src/executar
      # As migrações são aplicadas em ORDEM, à mão — não há aplicador (pendência
      # declarada em escrita.py). Aplicá-las aqui prova, a cada PR, que a sequência
      # inteira sobe num banco limpo: sem isso, uma migração nova só falharia no
      # banco de quem opera.
      - name: Cliente psql
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
      - name: Aplicar migrações do Registro
        run: |
          for m in $(ls src/dados/registro/[0-9]*.sql | sort); do
            echo "aplicando $m"
            psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 -q -f "$m"
          done
      # `-rs` lista os pulados, e o `grep` FALHA o passo se houver algum: um skip
      # silencioso é indistinguível de um teste que passou, e é assim que o serviço
      # acima viraria enfeite no dia em que a variável de ambiente sumisse.
      - name: Testes (nenhum pode ser pulado)
        run: |
          set -o pipefail
          uv run pytest -q -rs | tee /tmp/pytest.txt
          resumo=$(grep -E "passed|failed|error" /tmp/pytest.txt | tail -n 1)
          case "$resumo" in
            *skipped*)
              echo "::error::teste PULADO. Um skip é indistinguível de um teste que passou."
              echo "::error::Causas possíveis: o Postgres do CI não está sendo usado, ou uma"
              echo "::error::dependência de desenvolvimento sumiu e um teste se auto-pulou."
              grep -E "^SKIPPED" /tmp/pytest.txt || true
              exit 1 ;;
          esac
      # Fumaça do ponto de entrada: prova que o comando DOCUMENTADO roda de fato.
      # Sem isto, `python -m executar.segunda` voltaria a só funcionar com
      # PYTHONPATH=src — a falha que a fatia do runner existiu para consertar, e que
      # nenhum outro passo do CI toca (ruff/mypy/pytest não executam o __main__).
      - name: Fumaça dos pontos de entrada
        run: |
          uv run python -m executar.segunda --help
          uv run python -m executar.sexta --help
          uv run python -m executar.aprovar --help
          uv run python -m executar.referencias --help
          uv run python -m executar.contrato --help
          uv run python -m executar.trabalhador --help
          uv run python -m executar.previa --help
      # O formulário do console é gerado deste contrato, e o console importa uma CÓPIA
      # commitada (o painel não executa processo). Se a cópia envelhecer, o formulário
      # passa a pedir campo que o carregador não conhece — ou a esquecer o que ele
      # exige —, e o dono só descobre pelo código 5 depois de a rodada ser recusada.
      - name: O contrato commitado no console está em dia
        run: |
          uv run rodada-contrato > /tmp/contrato.json
          diff -u console/lib/contrato-parametros.json /tmp/contrato.json || {
            echo "::error::o contrato mudou e console/lib/contrato-parametros.json não acompanhou."
            echo "Regere com: uv run rodada-contrato > console/lib/contrato-parametros.json"
            exit 1
          }
      # A sexta precisa RECUSAR o que o carregador recusa. Desde a D-034 chave AUSENTE
      # não é erro (cai no adotado), então a sonda antiga — apagar uma linha e esperar 5
      # — deixou de provar qualquer coisa. O que ainda sai 5: o nº 14 meio-declarado
      # (um nível só; nunca inventar o outro) e chave desconhecida (nome digitado errado
      # nunca é descartado em silêncio). Os dois passam pela validação de verdade — a
      # primeira versão deste passo apontava para um caminho inexistente, que saía 5
      # pelo ramo de arquivo ilegível sem nunca chegar à validação.
      - name: A sexta recusa parâmetro meio-declarado e chave desconhecida
        run: |
          printf '[resultado_esperado]\nsuper_destaque = 3\n' > /tmp/meio.toml
          codigo=0
          uv run python -m executar.sexta --parametros /tmp/meio.toml || codigo=$?
          test "$codigo" -eq 5 || { echo "esperado 5 (nº 14 meio-declarado), veio $codigo"; exit 1; }
          printf '[portal]\npeso_nota = 70\npeso_cliques = 30\npeso_visualizacoes = 0\nforma = "x"\n' > /tmp/estranha.toml
          codigo=0
          uv run python -m executar.sexta --parametros /tmp/estranha.toml || codigo=$?
          test "$codigo" -eq 5 || { echo "esperado 5 (chave desconhecida), veio $codigo"; exit 1; }
      # E precisa recusar o MODELO como entrada real: ele carrega com sucesso, então
      # sem esta recusa sairia dele uma planilha de aparência normal, construída sobre
      # números que o próprio arquivo declara ilustrativos.
      - name: A sexta recusa o modelo ilustrativo
        run: |
          codigo=0
          uv run python -m executar.sexta --parametros docs/parametros-da-rodada.exemplo.toml \
            || codigo=$?
          test "$codigo" -eq 5 || { echo "esperado 5 (modelo recusado), veio $codigo"; exit 1; }
      # O carimbo de aprovação é o elo entre a sexta e a segunda, e as duas recusas
      # abaixo são as que o protegem. Vão ao CI porque só rodam contra um Postgres
      # real com o esquema aplicado — exatamente a metade que, antes do serviço
      # acima, nenhum ambiente automatizado exercitava.
      - name: A aprovação recusa rodada inexistente e RE-carimbo
        run: |
          codigo=0
          uv run python -m executar.aprovar tacita 99999999 || codigo=$?
          test "$codigo" -eq 4 || { echo "esperado 4 (inexistente), veio $codigo"; exit 1; }
          # Rodada de decisão JÁ aprovada: re-carimbar deslocaria a janela que a
          # segunda mede e poderia trocar a carga vigente, sem deixar rastro.
          id=$(psql "$POSTGRES_URL" -tAqc "INSERT INTO registro.rodada
            (tipo, inicio, fim, estado, aprovada_em, aprovada_por)
            VALUES ('decisao', now() - interval '2 hour', now() - interval '90 minute',
                    'completa', now() - interval '1 hour', 'ci') RETURNING id")
          codigo=0
          uv run python -m executar.aprovar tacita "$id" || codigo=$?
          test "$codigo" -eq 7 || { echo "esperado 7 (ja aprovada), veio $codigo"; exit 1; }
          por=$(psql "$POSTGRES_URL" -tAqc "SELECT aprovada_por FROM registro.rodada WHERE id = $id")
          test "$por" = "ci" || { echo "carimbo SOBRESCRITO: $por"; exit 1; }
      # A ponta positiva: sem ela, os dois testes acima passariam com um comando que
      # recusa tudo. Aprova uma rodada pendente e confere que ela vira a carga vigente
      # — que é o efeito pelo qual a fatia inteira existe.
      - name: A aprovação CARIMBA uma rodada pendente
        run: |
          id=$(psql "$POSTGRES_URL" -tAqc "INSERT INTO registro.rodada
            (tipo, inicio, fim, estado) VALUES ('decisao', now() - interval '2 hour',
            now() - interval '90 minute', 'completa') RETURNING id")
          uv run python -m executar.aprovar aprovar "$id" --por ci
          carimbo=$(psql "$POSTGRES_URL" -tAqc "SELECT aprovada_por FROM registro.rodada WHERE id = $id")
          test "$carimbo" = "ci" || { echo "nao carimbou: '$carimbo'"; exit 1; }
      # O `--dry-run` promete "roda todas as guardas e NÃO grava". A promessa
      # sobrevivia a mutação na suíte E no CI (a fiação de `main` não tinha trava):
      # bastava fixar `dry_run=False` para o ensaio passar a carimbar em silêncio.
      - name: O ensaio da aprovação não grava
        run: |
          id=$(psql "$POSTGRES_URL" -tAqc "INSERT INTO registro.rodada
            (tipo, inicio, fim, estado) VALUES ('decisao', now() - interval '2 hour',
            now() - interval '90 minute', 'completa') RETURNING id")
          uv run python -m executar.aprovar tacita "$id" --dry-run
          carimbo=$(psql "$POSTGRES_URL" -tAqc "SELECT coalesce(aprovada_por, 'NULO')
            FROM registro.rodada WHERE id = $id")
          test "$carimbo" = "NULO" || { echo "--dry-run GRAVOU: $carimbo"; exit 1; }
      # TODAS as migrações, não só a 001: elas são aplicadas à mão (não há aplicador
      # em ordem — pendência declarada em escrita.py), então um erro de sintaxe numa
      # migração nova só apareceria na hora de aplicar, no banco de quem opera.
      # A TRAVESSIA: o console serializa em TypeScript, a rodada valida em Python, e os
      # dois lados podem concordar consigo mesmos enquanto discordam ENTRE SI. Nenhum
      # teste de um lado só cobre isso.
      #
      # Vem DEPOIS do check do contrato de propósito: se o JSON commitado envelhecer, é
      # aquele passo que diagnostica ("regere com..."), e este só sintomatiza com um
      # erro de TOML. O que diagnostica falha primeiro.
      #
      # Confere DESTINO, não só estrutura: trocar `portal.peso_nota` por
      # `portal.peso_cliques` na serialização geraria TOML válido, que carrega limpo, com os
      # dois pesos trocados — e o CI ficaria verde sem a comparação de valores.
      - name: O TOML que o console gera carrega na rodada
        run: |
          npm --prefix console ci --no-audit --no-fund
          for caso in sem_opcionais com_opcionais vazio; do
            (cd console && node --import tsx scripts/travessia.ts "$caso" "/tmp/t-$caso.toml")
            uv run python scripts/conferir_travessia.py "/tmp/t-$caso.toml" "/tmp/t-$caso.esperado.json"
          done
      - name: Parse do DDL do Registro (dialeto postgres)
        run: >
          uv run --with 'sqlglot==30.17.0' python -c
          "import sqlglot, pathlib;
          arquivos = sorted(pathlib.Path('src/dados/registro').glob('*.sql'));
          assert arquivos, 'nenhuma migracao encontrada — o passo passaria guardando nada';
          total = sum(len(sqlglot.parse(a.read_text(), read='postgres')) for a in arquivos);
          print(f'DDL OK: {len(arquivos)} migracoes, {total} statements')"

  # Job do Coletor Externo (TypeScript). Separado de "verificar" e NÃO obrigatório
  # na proteção de main até ser adicionado a ela pelo dono (ação administrativa).
  coletor-externo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coletor-externo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Instala dependências (lockfile commitado)
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Testes (módulos puros)
        run: npm test

  # Job do Console do Operador (Next.js). Separado e NÃO obrigatório na proteção de
  # main até o dono o adicionar (ação administrativa), como o coletor-externo.
  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Instala dependências (lockfile commitado)
        run: npm ci --no-audit --no-fund
      - name: Testes (lógica pura + leitura de arquivos)
        run: npm test
      - name: Build (compila, lint e typecheck do Next)
        run: npm run build
