name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Dependências de desenvolvimento
        run: uv sync --group dev
      - name: Lint
        run: uv run ruff check src tests
      - name: Formatação
        run: uv run ruff format --check src tests
      # Tipos do domínio PURO em modo estrito: é o que sustenta a fronteira de PII
      # do invariante 3 (só `PayloadModelo` chega a modelo). Sem este passo, a
      # fronteira seria honorária — ver comentário em pyproject.toml.
      - name: Tipos (domínio, estrito)
        run: uv run mypy --strict src/dominio
      - name: Testes
        run: uv run pytest -q
      # Fumaça do ponto de entrada: prova que o comando DOCUMENTADO roda de fato.
      # Sem isto, `python -m executar.segunda` voltaria a só funcionar com
      # PYTHONPATH=src — a falha que a fatia do runner existiu para consertar, e que
      # nenhum outro passo do CI toca (ruff/mypy/pytest não executam o __main__).
      - name: Fumaça do ponto de entrada
        run: uv run python -m executar.segunda --help
      - name: Parse do DDL do Registro (dialeto postgres)
        run: >
          uv run --with 'sqlglot==30.17.0' python -c
          "import sqlglot;
          n = len(sqlglot.parse(open('src/dados/registro/001_registro.sql').read(), read='postgres'));
          print(f'DDL OK: {n} statements')"

  # Job do Coletor Externo (TypeScript). Separado de "verificar" e NÃO obrigatório
  # na proteção de main até ser adicionado a ela pelo dono (ação administrativa).
  coletor-externo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coletor-externo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Instala dependências (lockfile commitado)
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Testes (módulos puros)
        run: npm test

  # Job do Console do Operador (Next.js). Separado e NÃO obrigatório na proteção de
  # main até o dono o adicionar (ação administrativa), como o coletor-externo.
  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Instala dependências (lockfile commitado)
        run: npm ci --no-audit --no-fund
      - name: Testes (lógica pura + leitura de arquivos)
        run: npm test
      - name: Build (compila, lint e typecheck do Next)
        run: npm run build
