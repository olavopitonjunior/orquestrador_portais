[project]
name = "orquestrador-portais"
version = "0.0.0"
description = "Curadoria automatizada da vitrine de destaques de imóveis da Newcore"
requires-python = ">=3.12"
# src/dominio segue stdlib puro por desenho (invariante 4 — cálculo
# determinístico, sem I/O e sem modelo); o auditor verifica que ele não importa
# nada daqui. As dependências abaixo são das camadas de FORA do domínio: pymysql
# (src/dados: o Coletor Interno lê o MySQL do Newcore; cryptography cobre o
# caminho não-SSL do caching_sha2_password — ver docs/mapa-de-dados.md) e
# langgraph (src/grafo: a orquestração da rodada; importado SÓ em src/grafo,
# nunca no domínio).
dependencies = [
    "pymysql>=1.1",
    "cryptography>=42",
    "langgraph>=0.2",
    # src/dados/registro: escrita e leitura do PostgreSQL PRÓPRIO (o Registro,
    # Spec §2 — a única escrita do sistema, invariante 2). Um Postgres, uma
    # POSTGRES_URL, dois esquemas (registro + o checkpointer do grafo).
    "psycopg[binary]>=3.2",
    "langgraph-checkpoint-postgres>=3.1",
]

# O projeto é INSTALÁVEL para que os pontos de entrada de `src/executar/` rodem de
# verdade: sem isto, `python -m executar.segunda` só funcionava com `PYTHONPATH=src`
# — ou seja, o comando documentado falhava para quem não fosse o autor, que é
# exatamente o que a fatia do runner existe para consertar.
[project.scripts]
rodada-segunda = "executar.segunda:main"
rodada-sexta = "executar.sexta:main"
rodada-aprovar = "executar.aprovar:main"
rodada-contrato = "executar.contrato:main"
rodada-trabalhador = "executar.trabalhador:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# TODOS os pacotes de `src/` — inclusive os que só são alcançados por import
# transitivo (`piloto`, via `grafo.estado`). Esquecer um passa despercebido no
# editable install, cujo .pth põe `src/` inteiro no path: o wheel sai quebrado só
# para quem instala de verdade. `test_empacotamento.py` trava esta lista contra o
# disco justamente para o sétimo pacote não repetir o erro.
# `src/config` entrou quando ganhou o CARREGADOR dos parâmetros (nenhum valor mora
# lá; ver o módulo). O gatilho previsto funcionou: o teste acusou o pacote fora do
# wheel no mesmo commit em que o primeiro .py nasceu.
packages = [
    "src/config",
    "src/dados",
    "src/dominio",
    "src/entrega",
    "src/executar",
    "src/grafo",
    "src/piloto",
]

[dependency-groups]
dev = [
    # Os testes leem os workflows do GitHub: YAML inválido não roda check NENHUM,
    # e só o pytest local pode acusar isso antes do push.
    "pyyaml>=6",
    "mypy>=1.13",
    "pytest>=8",
    "ruff>=0.6",
]

# Checagem de tipos. O CI roda `mypy --strict` sobre `src/dominio` — o domínio PURO,
# onde vivem as regras de decisão e a fronteira de PII do invariante 3
# (`PayloadModelo` só passa se o tipo bater). Sem isso, essa fronteira seria uma
# promessa de docstring: o `payload_para_modelo` existe justamente para o type
# checker barrar o objeto com identidade de pessoa, e alguém precisa rodar o
# checker. As demais camadas (grafo/dados/entrega) ainda não passam no --strict —
# em boa parte por ruído de tipos do LangGraph — e ficam fora por ora; ampliar a
# cobertura é fatia futura, não um "não se aplica".
[tool.mypy]
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
